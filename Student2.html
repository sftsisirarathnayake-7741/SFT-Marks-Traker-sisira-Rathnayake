<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFT Student Portal - Marks & Progress Tracker</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">

    <!-- Header / Navigation -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
                </svg>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">SFT Student Portal</h1>
                    <p class="text-xs text-slate-400">STUDENT MARKS & PERFORMANCE</p>
                </div>
            </div>

            <!-- Teacher Profile & Class Info -->
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                    <!-- Teacher Photo -->
                    <img src="https://lh3.googleusercontent.com/d/11_imMquE7xC7IMEnpNLAN8dUHzF9V2vC=s220" alt="Sisira Rathnayake" class="w-7 h-7 rounded-full object-cover border border-sky-400">
                    <span class="text-sm font-medium text-slate-200">Sisira Rathnayake</span>
                </div>

                <select class="bg-slate-800 text-sm text-slate-200 border border-slate-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-sky-500">
                    <option>Matara Class</option>
                    <option>Tangalle Class</option>
                </select>

                <button class="bg-sky-600 hover:bg-sky-500 text-white text-sm px-3 py-1.5 rounded-lg flex items-center space-x-1 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>Refresh</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
        
        <!-- Student Lookup Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex items-center space-x-2 text-sky-600 mb-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <h2 class="text-lg font-bold text-slate-800">Student Lookup</h2>
            </div>
            <p class="text-sm text-slate-500 mb-6">Enter your Student ID to view your marks, rank history, and performance graph.</p>
            
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" placeholder="Enter Student ID (e.g. ST001)" class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-sky-500 focus:bg-white">
                <button class="bg-sky-600 hover:bg-sky-700 text-white font-medium px-6 py-3 rounded-xl text-sm flex items-center justify-center space-x-2 transition shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <span>Search</span>
                </button>
                <button class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-5 py-3 rounded-xl text-sm transition">
                    Clear
                </button>
            </div>
        </div>

        <!-- Result / Empty State Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center">
            <div class="w-16 h-16 bg-sky-50 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-1">No Student Selected</h3>
            <p class="text-sm text-slate-500">Please enter your Student ID above and click Search to check your performance.</p>
        </div>

    </main>

</body>
</html>
